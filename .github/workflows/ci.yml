name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Demo smoke test
        run: |
          cd "$(mktemp -d)"
          inbox-sweep demo --dir d
          inbox-sweep --config d/sweep.toml apply d/plan.json --yes
          inbox-sweep --config d/sweep.toml undo d/trash-log-*.jsonl --yes

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plugin manifests are valid JSON
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Browser helpers parse
        run: node --check skills/inbox-sweep/browser/gmail-helpers.js
