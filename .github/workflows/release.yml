# Publishes to PyPI when a version tag (v0.3.0, ...) is pushed.
#
# One-time setup by the repository owner (no API tokens are stored anywhere):
#   1. pypi.org -> Your projects -> Publishing -> add a "pending publisher":
#      owner aprax9, repository inbox-sweep, workflow release.yml, environment pypi.
#   2. GitHub -> Settings -> Environments -> New environment "pypi"
#      (optionally require a reviewer).
# Then: git tag v0.3.0 && git push origin v0.3.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"; exit 1
          fi
      - name: Test
        run: |
          python -m pip install -q -e ".[dev]"
          python -m pytest -q
          inbox-sweep eval --corpus --max-false-trash 0
      - name: Build
        run: |
          python -m pip install -q build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
