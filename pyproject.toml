[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "inbox-sweep"
version = "0.3.0"
description = "Clean a decades-old inbox down to what you'd want in 20 years. Trash-only, protect-first, review before anything moves."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The inbox-sweep authors" }]
keywords = ["gmail", "outlook", "email", "inbox", "cleanup", "imap", "unsubscribe"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gmail = [
  "google-api-python-client>=2.100",
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
]
outlook = ["msal>=1.28"]
ai = ["anthropic>=2.0"]
all = ["inbox-sweep[gmail,outlook,ai]"]
dev = ["pytest>=8", "hypothesis>=6", "inbox-sweep[all]"]

[project.scripts]
inbox-sweep = "inbox_sweep.cli:main"

[project.urls]
Homepage = "https://github.com/aprax9/inbox-sweep"
Issues = "https://github.com/aprax9/inbox-sweep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_sweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
